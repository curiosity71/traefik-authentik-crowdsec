<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.box{stroke-width:2;rx:14}.edge{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#a)}.auth{fill:none;stroke:#16a34a;stroke-width:2.6;marker-end:url(#g)}.mon{fill:none;stroke:#2563eb;stroke-width:2.6;marker-end:url(#b)}</style></defs>
<rect width="1200" height="760" fill="#f8fafc"/>
<text x="600" y="48" text-anchor="middle" class="title">So arbeitet der Traefik-, Authentik- und CrowdSec-Stack</text>
<text x="600" y="75" text-anchor="middle" class="sub">Zugriff von außen · zentrale Anmeldung · Erkennung und Abwehr</text>
<!-- user and edge -->
<rect x="42" y="180" width="170" height="95" fill="#fff" stroke="#94a3b8" class="box"/>
<text x="127" y="213" text-anchor="middle" class="head">Nutzer / Client</text><text x="127" y="239" text-anchor="middle" class="body">HTTPS · TCP/UDP 443</text><text x="127" y="259" text-anchor="middle" class="small">Webdienste und Dashboards</text>
<rect x="290" y="165" width="220" height="125" fill="#e0f2fe" stroke="#0284c7" class="box"/>
<text x="400" y="202" text-anchor="middle" class="head">Traefik</text><text x="400" y="228" text-anchor="middle" class="body">TLS · Zertifikate · Routing</text><text x="400" y="251" text-anchor="middle" class="small">Docker- und Dateiprovider</text><text x="400" y="271" text-anchor="middle" class="small">Bouncer prüft CrowdSec-Entscheide</text>
<path d="M212 227 H286" class="edge"/>
<!-- authentik -->
<rect x="595" y="105" width="240" height="125" fill="#dcfce7" stroke="#16a34a" class="box"/>
<text x="715" y="141" text-anchor="middle" class="head">Authentik</text><text x="715" y="168" text-anchor="middle" class="body">Login und Forward Auth</text><text x="715" y="191" text-anchor="middle" class="small">Server + Worker</text><text x="715" y="211" text-anchor="middle" class="small">Identitäten und Richtlinien</text>
<rect x="900" y="110" width="220" height="95" fill="#f0fdf4" stroke="#4ade80" class="box"/>
<text x="1010" y="146" text-anchor="middle" class="head">PostgreSQL</text><text x="1010" y="173" text-anchor="middle" class="body">Authentik-Datenbank</text>
<path d="M835 166 H896" class="edge"/>
<path d="M400 161 C440 80 520 80 590 135" class="auth"/>
<text x="487" y="101" text-anchor="middle" class="small">1 · geschützte Route fragt Anmeldung an</text>
<path d="M590 191 C520 308 445 320 400 292" class="auth"/>
<text x="492" y="316" text-anchor="middle" class="small">2 · erlaubt oder leitet zum Login weiter</text>
<!-- services -->
<rect x="290" y="390" width="220" height="100" fill="#fff" stroke="#94a3b8" class="box"/>
<text x="400" y="427" text-anchor="middle" class="head">Webdienst</text><text x="400" y="454" text-anchor="middle" class="body">im Docker-Netzwerk „proxy“</text><text x="400" y="475" text-anchor="middle" class="small">Antwort zurück über Traefik</text>
<path d="M400 291 V385" class="edge"/><text x="415" y="350" class="small">3 · Weiterleitung</text>
<rect x="42" y="397" width="170" height="86" fill="#fff" stroke="#94a3b8" class="box"/>
<text x="127" y="431" text-anchor="middle" class="head">Login-Seite</text><text x="127" y="458" text-anchor="middle" class="body">auth.example…</text>
<path d="M593 207 C553 351 340 354 212 429" class="auth"/><text x="496" y="367" class="small">Anmeldung im Browser</text>
<!-- crowdsec -->
<rect x="595" y="390" width="240" height="115" fill="#ffedd5" stroke="#f97316" class="box"/>
<text x="715" y="427" text-anchor="middle" class="head">CrowdSec</text><text x="715" y="453" text-anchor="middle" class="body">liest Traefik-Logs</text><text x="715" y="476" text-anchor="middle" class="small">Erkennung · AppSec/WAF · Entscheidungen</text>
<path d="M510 452 H590" class="mon"/><text x="550" y="438" text-anchor="middle" class="small">Logs</text>
<path d="M600 404 C560 345 495 300 490 282" class="mon"/><text x="545" y="337" class="small">Entscheide</text>
<rect x="900" y="400" width="220" height="95" fill="#fff7ed" stroke="#fb923c" class="box"/>
<text x="1010" y="436" text-anchor="middle" class="head">CrowdSec Manager</text><text x="1010" y="463" text-anchor="middle" class="body">Verwaltung per Web</text><text x="1010" y="483" text-anchor="middle" class="small">Zugriff via Traefik + Authentik</text>
<path d="M835 447 H896" class="edge"/>
<!-- docker API -->
<rect x="45" y="590" width="245" height="105" fill="#f1f5f9" stroke="#64748b" class="box"/>
<text x="167" y="626" text-anchor="middle" class="head">Docker-Daemon</text><text x="167" y="652" text-anchor="middle" class="body">Container-API</text><text x="167" y="674" text-anchor="middle" class="small">Socket bleibt ohne Host-Port</text>
<rect x="360" y="570" width="265" height="140" fill="#f1f5f9" stroke="#64748b" class="box"/>
<text x="492" y="603" text-anchor="middle" class="head">Getrennte Socket-Proxys</text><text x="492" y="632" text-anchor="middle" class="body">Traefik / CrowdSec: lesender Zugriff</text><text x="492" y="658" text-anchor="middle" class="body">Authentik: Container verwalten</text><text x="492" y="684" text-anchor="middle" class="body">Manager: Logs und Admin-Aktionen</text>
<path d="M290 641 H356" class="edge"/>
<path d="M400 290 C350 450 400 500 450 566" class="edge"/>
<path d="M715 506 C690 535 625 558 600 572" class="edge"/>
<path d="M1010 496 C940 560 760 608 629 628" class="edge"/>
